modLoader = "javafml"
loaderVersion = "${neoforge_loader_version_range}"
license = "${license}"
issueTrackerURL = "https://github.com/AlexFirst404/CONTROLGUI/issues"

[[mods]]
modId = "${mod_id}"
version = "${version}"
displayName = "${mod_name}"
displayURL = "https://github.com/AlexFirst404/CONTROLGUI"
logoFile = "${mod_id}.png"
authors = "${mod_author}"
description = '''${description}'''

[[mixins]]
config = "controlgui.mixins.json"

[[dependencies.${mod_id}]]
modId = "neoforge"
type = "required"
versionRange = "[${neoforge_version},)"
ordering = "NONE"
side = "CLIENT"

[[dependencies.${mod_id}]]
modId = "minecraft"
type = "required"
versionRange = "${minecraft_version_range}"
ordering = "NONE"
side = "CLIENT"

# Собственный движок Chromium встроен в мод — сторонний MCEF несовместим
# (два экземпляра CEF/org.cef в одной JVM конфликтуют).
[[dependencies.${mod_id}]]
modId = "mcef"
type = "incompatible"
versionRange = "*"
ordering = "NONE"
side = "CLIENT"
