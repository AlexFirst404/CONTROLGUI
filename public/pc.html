<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Этот компьютер — CONTROLGUI</title>
<link rel="stylesheet" href="css/minecraft.css">
<style>
  html, body { height: 100%; margin: 0; background: #161616; overflow: hidden; }
  body { display: flex; flex-direction: column; font-family: var(--font-ui); color: #e6e6e6; }

  #pc-bar { display: flex; align-items: center; gap: 6px; flex: none;
    padding: 8px 10px; background: #202020; border-bottom: 2px solid #333; }
  .pc-btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    height: 30px; min-width: 30px; padding: 0 9px; background: #333; border: 2px solid #4a4a4a;
    color: #ddd; font-family: var(--font-ui); font-size: 13px; cursor: pointer;
    transition: background .1s, border-color .1s, transform .07s; }
  .pc-btn:hover { background: #444; color: #fff; }
  .pc-btn:active { transform: scale(.93); }
  .pc-btn:disabled { opacity: .4; cursor: default; }
  .pc-btn .pi { width: 14px; height: 14px; color: var(--accent-bright); }
  #pc-path { flex: 1; min-width: 0; height: 30px; box-sizing: border-box;
    display: flex; align-items: center; padding: 0 10px; background: #111;
    border: 2px solid #3a3a3a; color: #cfcfcf; font-size: 13px;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  #pc-main { flex: 1; min-height: 0; position: relative; }

  #pc-list { position: absolute; inset: 0; overflow: auto; padding: 8px;
    display: grid; grid-template-columns: repeat(auto-fill, minmax(104px, 1fr));
    grid-auto-rows: min-content; gap: 4px; align-content: start; }
  .pc-entry { display: flex; flex-direction: column; align-items: center; gap: 6px;
    padding: 10px 4px 8px; border: 2px solid transparent; cursor: default;
    user-select: none; transition: background .1s, border-color .1s; }
  .pc-entry:hover { background: #ffffff12; border-color: #ffffff1e; }
  .pc-entry.sel { background: #ffffff1f; border-color: var(--accent); }
  .pc-entry .pi { width: 36px; height: 36px; color: var(--accent-bright); }
  .pc-entry.file .pi { color: #b9b9b9; }
  .pc-entry .pc-name { max-width: 96px; text-align: center; font-size: 12.5px;
    line-height: 1.2; color: #e6e6e6; word-break: break-word;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .pc-entry.hidden-f { opacity: .55; }
  .pc-empty, .pc-error { position: absolute; inset: 0; display: flex; align-items: center;
    justify-content: center; color: #8a8a8a; font-size: 14px; text-align: center; padding: 20px; }
  .pc-error { color: #e0938c; }

  /* редактор текстового файла */
  #pc-editor { position: absolute; inset: 0; display: none; flex-direction: column; background: #161616; }
  #pc-editor.on { display: flex; }
  #pc-editor textarea { flex: 1; min-height: 0; width: 100%; box-sizing: border-box;
    resize: none; border: 0; outline: none; padding: 12px 14px;
    background: #141414; color: #e6e6e6; font-family: var(--font-mono, monospace);
    font-size: 13px; line-height: 1.5; }
  #pc-ed-info { flex: none; padding: 6px 12px; background: #202020; border-top: 2px solid #333;
    color: #9a9a9a; font-size: 12px; }

  /* мини-приглашение имени (создать папку/документ) */
  #pc-prompt, #pc-copy { position: absolute; inset: 0; z-index: 5; display: none;
    align-items: center; justify-content: center; background: rgba(0,0,0,.55); }
  #pc-prompt.on, #pc-copy.on { display: flex; }
  .pc-prompt-box { min-width: 300px; padding: 16px; background: #1c1c1c; border: 2px solid #4a4a4a; }
  .pc-prompt-box h4 { margin: 0 0 10px; font-family: var(--font-head); font-size: 14px; color: #eee; font-weight: normal; }
  .pc-prompt-box input { width: 100%; box-sizing: border-box; padding: 8px 10px; margin-bottom: 12px;
    background: #111; border: 2px solid #4a4a4a; color: #e8e8e8; font-family: var(--font-ui); font-size: 14px; }
  .pc-prompt-box input:focus { outline: none; border-color: var(--accent); }
  .pc-prompt-btns { display: flex; gap: 8px; justify-content: flex-end; }

  #pc-toast { position: fixed; left: 50%; bottom: 16px; transform: translateX(-50%) translateY(10px);
    z-index: 20; padding: 9px 15px; background: #1c1c1cf5; border: 2px solid #a13530;
    color: #f2dcda; font-size: 13px; opacity: 0; pointer-events: none; transition: opacity .18s, transform .18s; }
  #pc-toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  /* контекстное меню элемента (копировать в сервер / на рабочий стол) */
  #pc-menu { position: fixed; z-index: 30; min-width: 190px; display: none;
    background: #1c1c1c; border: 2px solid #4a4a4a; box-shadow: 0 8px 26px rgba(0,0,0,.6); padding: 4px; }
  #pc-menu.on { display: block; }
  .pc-mi { display: flex; align-items: center; gap: 8px; padding: 8px 10px; font-size: 13px;
    color: #ddd; cursor: default; white-space: nowrap; }
  .pc-mi:hover { background: #ffffff16; color: #fff; }
  .pc-mi .pi { width: 14px; height: 14px; color: var(--accent-bright); }

  /* выбор сервера для копирования */
  .pc-copy-row { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
  .pc-copy-row label { flex: none; width: 62px; font-size: 13px; color: #b7b7b7; }
  .pc-copy-row select { flex: 1; min-width: 0; padding: 7px 9px; background: #111;
    border: 2px solid #4a4a4a; color: #e8e8e8; font-family: var(--font-ui); font-size: 13.5px; }
  .pc-copy-row select:focus { outline: none; border-color: var(--accent); }
</style>
</head>
<body>
<div id="pc-bar">
  <button class="pc-btn" id="pc-up" title="Вверх"><i class="pi" style="--i:url('/icons/chevron-up.svg')"></i></button>
  <button class="pc-btn" id="pc-refresh" title="Обновить"><i class="pi" style="--i:url('/icons/reload.svg')"></i></button>
  <div id="pc-path">Этот компьютер</div>
  <button class="pc-btn" id="pc-newfolder" title="Создать папку"><i class="pi" style="--i:url('/icons/folder.svg')"></i>Папка</button>
  <button class="pc-btn" id="pc-newdoc" title="Создать документ"><i class="pi" style="--i:url('/icons/script-text.svg')"></i>Документ</button>
  <button class="pc-btn" id="pc-save" title="Сохранить" style="display:none"><i class="pi" style="--i:url('/icons/save.svg')"></i>Сохранить</button>
</div>
<div id="pc-main">
  <div id="pc-list"></div>
  <div id="pc-editor">
    <textarea id="pc-ta" spellcheck="false" autocomplete="off"></textarea>
    <div id="pc-ed-info"></div>
  </div>
  <div id="pc-prompt">
    <div class="pc-prompt-box">
      <h4 id="pc-prompt-title">Имя</h4>
      <input id="pc-prompt-input" type="text" autocomplete="off" spellcheck="false">
      <div class="pc-prompt-btns">
        <button class="pc-btn" id="pc-prompt-ok">Создать</button>
        <button class="pc-btn" id="pc-prompt-cancel">Отмена</button>
      </div>
    </div>
  </div>
  <div id="pc-copy">
    <div class="pc-prompt-box">
      <h4 id="pc-copy-title">Копировать в сервер</h4>
      <div class="pc-copy-row"><label>Сервер</label><select id="pc-copy-server"></select></div>
      <div class="pc-copy-row"><label>Куда</label><select id="pc-copy-sub">
        <option value="">Корень сервера</option>
        <option value="mods">mods</option>
        <option value="plugins">plugins</option>
        <option value="config">config</option>
        <option value="datapacks">datapacks</option>
      </select></div>
      <div class="pc-prompt-btns">
        <button class="pc-btn" id="pc-copy-ok">Копировать</button>
        <button class="pc-btn" id="pc-copy-cancel">Отмена</button>
      </div>
    </div>
  </div>
</div>
<div id="pc-menu"></div>
<div id="pc-toast"></div>
<script src="js/pc.js"></script>
</body>
</html>
