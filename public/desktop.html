<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<!-- режим внутри игры (мод): класс до первой отрисовки, чтобы не мигал чёрный фон -->
<script>(function(){try{if(location.search.indexOf("ingame=1")!==-1)sessionStorage.setItem("cgIngame","1");if(sessionStorage.getItem("cgIngame")==="1")document.documentElement.classList.add("ingame");}catch(e){}})();</script>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CONTROLGUI — рабочий стол</title>
<link rel="icon" type="image/png" href="/assets/controlgui.png">
<link rel="stylesheet" href="css/minecraft.css">
<link rel="stylesheet" href="css/desktop.css">
</head>
<body>
<!-- рабочий стол внутри Minecraft: серверы-иконки, окна поверх заблюренной
     игры, панель задач снизу слева, часы снизу справа. Управляется js/desktop.js -->
<div id="cg-desktop">
  <div id="cg-icons"></div>
</div>
<div id="cg-drag-shield" class="hidden"></div>
<div id="cg-menu" class="hidden"></div>
<div id="cg-confirm" class="hidden">
  <div class="cg-confirm-box">
    <div id="cg-confirm-text"></div>
    <input id="cg-confirm-input" class="hidden" type="text" autocomplete="off" spellcheck="false">
    <div class="cg-confirm-btns">
      <button class="cg-task-btn danger" id="cg-confirm-yes">Да</button>
      <button class="cg-task-btn" id="cg-confirm-no">Отмена</button>
    </div>
  </div>
</div>
<!-- win-меню («Пуск»): серверы, недавние файлы, снизу аккаунт и настройки -->
<div id="cg-start-menu" class="hidden">
  <div class="cg-sm-cols">
    <div class="cg-sm-col">
      <div class="cg-sm-title">Серверы</div>
      <div id="cg-sm-servers" class="cg-sm-list"></div>
    </div>
    <div class="cg-sm-col">
      <div class="cg-sm-title">Недавние файлы</div>
      <div id="cg-sm-recent" class="cg-sm-list"></div>
    </div>
  </div>
  <div class="cg-sm-bottom">
    <button id="cg-sm-account" class="cg-sm-acc" title="Профиль">
      <span id="cg-sm-avatar" class="cg-sm-avatar">?</span>
      <span id="cg-sm-nick">Аккаунт</span>
    </button>
    <button id="cg-sm-pc" class="cg-sm-iconbtn" title="Этот компьютер"><i class="pi" style="--i:url('/icons/monitor.svg')"></i></button>
    <button id="cg-sm-settings" class="cg-sm-iconbtn" title="Настройки панели"><i class="pi" style="--i:url('/icons/sliders.svg')"></i></button>
  </div>
</div>
<nav id="cg-taskbar">
  <button id="cg-start" title="Меню CONTROLGUI"><img src="/assets/controlgui.png" alt=""></button>
  <span class="cg-task-sep"></span>
  <button class="cg-task-btn" data-app="servers" title="Серверы"><i class="pi" style="--i:url('/icons/server.svg')"></i><span>Серверы</span></button>
  <button class="cg-task-btn" data-app="pc" title="Этот компьютер"><i class="pi" style="--i:url('/icons/monitor.svg')"></i><span>Компьютер</span></button>
  <span class="cg-task-sep"></span>
  <span id="cg-task-wins"></span>
  <span class="cg-task-spring"></span>
  <div id="cg-clock"><span id="cg-clock-time">--:--</span><span id="cg-clock-date"></span></div>
</nav>
<script src="js/desktop.js"></script>
</body>
</html>
