<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Вход — CONTROLGUI</title>
<link rel="icon" type="image/png" href="/assets/controlgui.png">
<link rel="stylesheet" href="css/minecraft.css">
</head>
<body class="theme-lime">
<div class="bg-pattern"></div>
<div class="shade"></div>

<div class="login-wrap">
  <div class="mc-card login-card">
    <h1 class="login-title">CONTROL<span class="hero-accent">GUI</span></h1>
    <div class="login-sub">Удалённый доступ к панели</div>

    <form id="login-form" autocomplete="off">
      <label class="mc-label">Логин
        <input class="fld" id="login-user" autocomplete="username" autofocus required>
      </label>
      <label class="mc-label" style="margin-top:14px">Пароль
        <span class="pass-wrap">
          <input class="fld" id="login-pass" type="password" autocomplete="current-password" required>
          <button type="button" class="pass-eye" id="login-eye" title="Показать пароль" aria-label="Показать пароль"></button>
        </span>
      </label>
      <div class="login-error hidden" id="login-error"></div>
      <button type="submit" class="mc-btn primary login-btn" id="login-btn">Войти</button>
    </form>
  </div>
</div>

<script>
(function () {
  // глаз показа/скрытия пароля (иконки eye / eye-closed из Pixelarticons)
  var pass = document.getElementById('login-pass');
  var eye = document.getElementById('login-eye');
  function setEye() {
    var shown = pass.type === 'text';
    eye.style.setProperty('--i', "url('/icons/" + (shown ? 'eye-closed' : 'eye') + ".svg')");
    eye.title = shown ? 'Скрыть пароль' : 'Показать пароль';
  }
  eye.addEventListener('click', function () {
    pass.type = pass.type === 'password' ? 'text' : 'password';
    setEye();
    pass.focus();
  });
  setEye();

  var form = document.getElementById('login-form');
  var err = document.getElementById('login-error');
  var btn = document.getElementById('login-btn');
  form.addEventListener('submit', async function (event) {
    event.preventDefault();
    err.classList.add('hidden');
    btn.disabled = true;
    var prev = btn.textContent;
    btn.textContent = 'Проверяю…';
    try {
      var res = await fetch('/api/auth/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          username: document.getElementById('login-user').value,
          password: document.getElementById('login-pass').value,
        }),
      });
      if (res.ok) {
        location.href = '/';
        return;
      }
      var data = {};
      try { data = await res.json(); } catch (e) {}
      err.textContent = data.error || 'Неверный пароль';
      err.classList.remove('hidden');
    } catch (e) {
      err.textContent = 'Нет связи с панелью';
      err.classList.remove('hidden');
    } finally {
      btn.disabled = false;
      btn.textContent = prev;
    }
  });
})();
</script>
</body>
</html>
