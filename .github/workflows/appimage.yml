name: Build AppImage

# Собирает .AppImage (приложение + браузер) на Linux-раннере и прикрепляет их
# к релизу. Запускается автоматически при изменении файлов сборки на ветке
# linux-deb, либо вручную: вкладка Actions → Build AppImage → Run workflow.
on:
  push:
    branches: [linux-deb]
    paths:
      - 'linux/build-appimage.sh'
      - 'linux/appimage/**'
      - '.github/workflows/appimage.yml'
  workflow_dispatch:
    inputs:
      version:
        description: 'Версия (для имени файла)'
        required: true
        default: '1.3.0'
      release_tag:
        description: 'Тег релиза, куда заливать .AppImage'
        required: true
        default: 'v1.3.0-linux'

permissions:
  contents: write

env:
  VERSION: ${{ github.event.inputs.version || '1.3.0' }}
  RELEASE_TAG: ${{ github.event.inputs.release_tag || 'v1.3.0-linux' }}

jobs:
  appimage:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Установить инструменты
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            curl xz-utils file desktop-file-utils libfuse2

      - name: Собрать AppImage (app + browser)
        run: |
          chmod +x linux/build-appimage.sh
          ./linux/build-appimage.sh all "$VERSION"
          ls -lh linux/*.AppImage

      - name: Прикрепить к релизу
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$RELEASE_TAG" \
            linux/*.AppImage --clobber --repo "${{ github.repository }}"

      - name: Сохранить как артефакты сборки
        uses: actions/upload-artifact@v4
        with:
          name: controlgui-appimage
          path: linux/*.AppImage
