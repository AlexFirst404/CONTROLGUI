name: Build AppImage

# Собирает .AppImage (приложение + браузер) на Linux-раннере и прикрепляет к релизу.
# Запуск ТОЛЬКО вручную: Actions → Build AppImage → Run workflow (укажите версию и тег
# релиза). На push НЕ запускается — иначе собирался бы с дефолтной версией и лил в
# несуществующий тег.
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Версия (для имени файла)'
        required: true
        default: '2.3.0'
      release_tag:
        description: 'Тег релиза, куда заливать .AppImage'
        required: true
        default: 'v2.3.0'

permissions:
  contents: write

env:
  VERSION: ${{ github.event.inputs.version }}
  RELEASE_TAG: ${{ github.event.inputs.release_tag }}

jobs:
  appimage:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Установить инструменты
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            curl xz-utils file desktop-file-utils libfuse2

      - name: Собрать AppImage
        run: |
          chmod +x linux/build-appimage.sh
          ./linux/build-appimage.sh "$VERSION"
          ls -lh linux/*.AppImage

      - name: Прикрепить к релизу
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$RELEASE_TAG" \
            linux/*.AppImage --clobber --repo "${{ github.repository }}"
