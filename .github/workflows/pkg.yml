name: Build macOS PKG

# Собирает .pkg-установщик (Apple Silicon + Intel) на macOS-раннерах и прикрепляет
# к релизу. Окно нативное (Swift + WKWebView). Запуск ТОЛЬКО вручную:
# Actions → Build macOS PKG → Run workflow (укажите версию и тег релиза).
# На push НЕ запускается — иначе собирался бы с дефолтной версией и без заливки в релиз.
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Версия (для имени файла)'
        required: true
        default: '2.3.2'
      release_tag:
        description: 'Тег релиза, куда заливать .pkg'
        required: true
        default: 'v2.3.2'

permissions:
  contents: write

env:
  VERSION: ${{ github.event.inputs.version }}
  RELEASE_TAG: ${{ github.event.inputs.release_tag }}

jobs:
  pkg:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: macos-14, arch: arm64 }
          - { runner: macos-15-intel, arch: x64 }
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Собрать PKG
        run: |
          chmod +x mac/build-pkg.sh
          ./mac/build-pkg.sh "$VERSION"
          ls -lh mac/*.pkg

      - name: Прикрепить к релизу
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$RELEASE_TAG" mac/*.pkg --clobber --repo "${{ github.repository }}"
