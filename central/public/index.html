<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CONTROLGUI Remote</title>
<link rel="stylesheet" href="/css/minecraft.css">
<link rel="stylesheet" href="/css/style.css">
</head>
<body class="theme-lime">
<div class="bg-pattern"></div>
<div class="shade"></div>

<div class="wrap">
  <div class="top">
    <div class="brand">CONTROL<b>GUI</b> <span class="sub">REMOTE</span></div>
    <div class="row" id="userbar"></div>
  </div>

  <!-- АВТОРИЗАЦИЯ -->
  <div id="auth" class="card center-card hidden">
    <div class="tabs">
      <button class="mc-btn sm active" id="tab-login">Вход</button>
      <button class="mc-btn sm" id="tab-reg">Регистрация</button>
    </div>
    <form id="form-login">
      <label>Логин</label><input class="fld" id="li-user" autocomplete="username" required>
      <label>Пароль</label><input class="fld" id="li-pass" type="password" autocomplete="current-password" required>
      <div class="err" id="li-err"></div>
      <div class="row" style="margin-top:14px"><button class="mc-btn primary grow" type="submit">Войти</button></div>
    </form>
    <form id="form-reg" class="hidden">
      <label>Логин (ник)</label><input class="fld" id="rg-user" required>
      <label>Пароль (мин. 6)</label><input class="fld" id="rg-pass" type="password" required>
      <div class="err" id="rg-err"></div>
      <div class="muted" style="margin-top:8px">После регистрации аккаунт ждёт одобрения администратором.</div>
      <div class="row" style="margin-top:14px"><button class="mc-btn primary grow" type="submit">Зарегистрироваться</button></div>
    </form>
  </div>

  <!-- ПРИЛОЖЕНИЕ -->
  <div id="app" class="hidden">
    <div class="card">
      <h2>Привязать сервер</h2>
      <div class="muted">Включите «Удалённое управление» в настройках сервера в панели CONTROLGUI — там покажется код. Введите его здесь.</div>
      <div class="row" style="margin-top:12px">
        <input id="link-code" class="fld grow" placeholder="Код привязки (напр. AB12-CD34)" maxlength="9" style="text-transform:uppercase">
        <button class="mc-btn primary" id="link-btn">Привязать</button>
      </div>
      <div class="err" id="link-err"></div>
    </div>
    <div class="card">
      <h2>Мои серверы</h2>
      <div id="servers"></div>
    </div>
  </div>
</div>

<style>
  #asg-perms{column-count:2;column-gap:22px}
  #asg-perms .asg-grp{break-inside:avoid}
  .asg-perm{display:flex;align-items:center;gap:10px;padding:3px 0;break-inside:avoid;cursor:pointer}
  .asg-perm input[type=checkbox]{appearance:none;-webkit-appearance:none;width:38px;height:20px;border-radius:11px;background:#3a3a3a;border:2px solid #555;position:relative;cursor:pointer;transition:.15s;flex:0 0 auto;margin:0}
  .asg-perm input[type=checkbox]::after{content:"";position:absolute;top:1px;left:1px;width:14px;height:14px;border-radius:50%;background:#bbb;transition:.15s}
  .asg-perm input[type=checkbox]:checked{background:#3a6a28;border-color:#5cb53d}
  .asg-perm input[type=checkbox]:checked::after{left:18px;background:#80da5b}
  @media (max-width:560px){ #asg-perms{column-count:1} }
</style>
<!-- модалка выдачи доступа -->
<div id="asg-modal" class="asg-overlay hidden">
  <div class="card" style="max-width:760px;width:94%;max-height:90vh;overflow:auto">
    <h2 id="asg-title">Доступ к серверу</h2>
    <div id="asg-access"></div>
    <hr class="sep" style="margin:14px 0">
    <label id="asg-user-label">Пользователь (одобренный аккаунт)</label>
    <select class="fld" id="asg-user"></select>
    <input class="fld" id="asg-user-nick" placeholder="Введите ник пользователя" autocomplete="off" style="display:none">
    <div class="row" style="margin:12px 0 6px">
      <span class="label-dim">Пресеты:</span>
      <button class="mc-btn sm" id="asg-preset-full">Полный</button>
      <button class="mc-btn sm" id="asg-preset-view">Просмотр</button>
      <button class="mc-btn sm" id="asg-preset-none">Снять всё</button>
    </div>
    <div id="asg-perms"></div>
    <div class="err" id="asg-err"></div>
    <div class="row" style="margin-top:14px;justify-content:flex-end">
      <button class="mc-btn sm" id="asg-cancel">Закрыть</button>
      <button class="mc-btn sm primary" id="asg-save">Выдать / обновить</button>
    </div>
  </div>
</div>

<div id="toast" class="toast"></div>

<!-- общая модалка подтверждения (вместо браузерного confirm) -->
<div id="cf-modal" class="asg-overlay hidden">
  <div class="card" style="max-width:420px;width:92%">
    <h2 id="cf-title">Подтверждение</h2>
    <div class="muted" id="cf-text" style="margin-bottom:14px"></div>
    <div class="row" style="justify-content:flex-end">
      <button class="mc-btn sm" id="cf-no">Отмена</button>
      <button class="mc-btn sm danger" id="cf-yes">Да</button>
    </div>
  </div>
</div>

<script>
const $ = (s) => document.querySelector(s);
const $$ = (s) => Array.from(document.querySelectorAll(s));
async function api(method, url, body){
  const r = await fetch(url, { method, headers: body?{'Content-Type':'application/json'}:undefined, body: body?JSON.stringify(body):undefined });
  let d={}; try{ d=await r.json(); }catch(e){}
  return { ok:r.ok, status:r.status, d };
}
function show(el,on){ $(el).classList.toggle('hidden', !on); }

let me = null;
async function load(){
  const r = await api('GET','/api/me');
  me = r.d && r.d.user;
  if(me){ show('#auth',false); show('#app',true); renderUser(); loadServers(); }
  else { show('#auth',true); show('#app',false); $('#userbar').innerHTML=''; }
}
function renderUser(){
  const admin = me.role==='admin';
  $('#userbar').innerHTML = '<span class="muted">'+me.username+(admin?' · админ':'')+'</span>'+
    (admin?' <a class="mc-btn sm" href="/admin">Админка</a>':'')+
    ' <button class="mc-btn sm" id="logout">Выйти</button>';
  $('#logout').onclick = async()=>{ await api('POST','/api/logout'); load(); };
}
async function loadServers(){
  const r = await api('GET','/api/servers');
  const list = (r.d && r.d.servers) || [];
  const box = $('#servers');
  if(!list.length){ box.innerHTML = '<div class="muted">У вас нет доступных удалённых серверов. Привяжите свой по коду выше'+(me.role==='admin'?' (или вам назначат).':' или попросите админа назначить.')+'</div>'; return; }
  box.innerHTML='';
  for(const s of list){
    const can = s.role==='owner'||s.role==='admin'||s.role==='assigned';
    const el = document.createElement('div'); el.className='srv';
    el.innerHTML = '<span class="dot'+(s.online?' on':'')+'" title="'+(s.online?'панель на связи':'панель офлайн')+'"></span>'+
      '<div class="grow"><div class="nm">'+esc(s.name)+'</div>'+
      '<div class="meta">'+(s.type?esc(s.type)+' ':'')+(s.version?esc(s.version):'')+' · статус: '+esc(s.status||'—')+(s.owner?' · владелец: '+esc(s.owner):'')+'</div></div>'+
      (s.role==='owner'?'<span class="badge own">МОЙ</span>':'')+
      (s.status==='running'?'<span class="badge run">RUNNING</span>':'')+
      '<div class="acts"></div>';
    const acts = el.querySelector('.acts');
    if(can){
      const mg=document.createElement('button'); mg.className='mc-btn sm accent'; mg.textContent='Управлять';
      mg.title='Полное управление: консоль, файлы, игроки, настройки…';
      mg.onclick=()=>{ location.href='/manage?s='+encodeURIComponent(s.globalId); };
      acts.appendChild(mg);
      for(const [a,label,cls] of [['start','Старт','primary'],['stop','Стоп','danger'],['restart','Рестарт','']]){
        const b=document.createElement('button'); b.className='mc-btn sm '+cls; b.textContent=label;
        b.onclick=async()=>{
          if(!await confirmModal(label+' сервер «'+s.name+'»?', label)) return;
          b.disabled=true; const rr=await api('POST','/api/servers/'+s.globalId+'/action',{action:a}); b.disabled=false;
          if(rr.d&&rr.d.error) toast(rr.d.error); else toast(label+': команда отправлена.',true); setTimeout(loadServers,1000); };
        acts.appendChild(b);
      }
    }
    if(s.role==='owner'||s.role==='admin'){
      const ab=document.createElement('button'); ab.className='mc-btn sm'; ab.textContent='Доступ…';
      ab.onclick=()=>assignPrompt(s); acts.appendChild(ab);
    }
    box.appendChild(el);
  }
}
// группы прав удалённого управления (зеркало REMOTE_PERMS панели)
const PERM_GROUPS = [
  ['Консоль', [['console.view','Просмотр консоли'],['console.command','Ввод команд']]],
  ['Логи', [['logs.view','Просмотр логов']]],
  ['Управление', [['server.start','Запуск'],['server.stop','Остановка / перезапуск'],['server.kill','Принудительное завершение'],['server.install','Установка ядра']]],
  ['Настройки', [['settings.edit','server.properties и память']]],
  ['Файлы', [['files.read','Просмотр / чтение'],['files.write','Изменение'],['files.upload','Загрузка'],['files.delete','Удаление']]],
  ['Игроки', [['players.kick','Кик'],['players.ban','Бан / разбан'],['players.op','Выдача OP'],['players.whitelist','Белый список'],['players.delete','Удаление данных']]],
  ['Бэкапы', [['backups.create','Создание'],['backups.restore','Восстановление'],['backups.delete','Удаление']]],
];
let assignTarget = null;
// промис-подтверждение вместо браузерного confirm
function confirmModal(text, title){
  return new Promise((resolve)=>{
    $('#cf-title').textContent = title || 'Подтверждение';
    $('#cf-text').textContent = text;
    show('#cf-modal', true);
    const done=(v)=>{ show('#cf-modal',false); $('#cf-yes').onclick=null; $('#cf-no').onclick=null; resolve(v); };
    $('#cf-yes').onclick=()=>done(true); $('#cf-no').onclick=()=>done(false);
  });
}
// тост вместо alert
let toastTimer=null;
function toast(msg, ok){ const t=$('#toast'); if(!t)return; t.textContent=msg; t.className='toast'+(ok?' ok':''); t.classList.add('show'); clearTimeout(toastTimer); toastTimer=setTimeout(()=>t.classList.remove('show'),3200); }

function permsOfUser(s, username){ const a=(s.access||[]).find(x=>x.username.toLowerCase()===String(username).toLowerCase()); return a&&a.perms?a.perms:null; }
function renderAsgPerms(checked){
  const box=$('#asg-perms'); box.innerHTML=''; const set=new Set(checked||[]);
  for(const [grp,items] of PERM_GROUPS){
    const h=document.createElement('div'); h.className='asg-grp'; h.textContent=grp; box.appendChild(h);
    for(const [key,label] of items){
      const lab=document.createElement('label'); lab.className='asg-perm';
      lab.innerHTML='<input type="checkbox" value="'+key+'"'+(set.has(key)?' checked':'')+'> '+esc(label);
      box.appendChild(lab);
    }
  }
}
async function refreshAssign(gid){ const f=await api('GET','/api/servers'); const fresh=(f.d.servers||[]).find(x=>x.globalId===gid); if(fresh) assignPrompt(fresh); loadServers(); }
async function assignPrompt(s){
  assignTarget = s;
  $('#asg-err').textContent='';
  $('#asg-title').textContent='Доступ к серверу «'+s.name+'»';
  // текущий доступ + «Забрать»
  const acc=$('#asg-access'); acc.innerHTML='';
  const list=(s.access||[]);
  if(!list.length){ acc.innerHTML='<div class="muted">Пока никому не выдан доступ.</div>'; }
  else for(const a of list){
    const row=document.createElement('div'); row.className='asg-acc-row';
    row.innerHTML='<span class="grow">'+esc(a.username)+' <span class="label-dim">('+(a.perms&&a.perms.length?a.perms.length+' прав':'просмотр')+')</span></span>';
    const ed=document.createElement('button'); ed.className='mc-btn sm'; ed.textContent='Изменить';
    ed.title='Редактировать права этого пользователя';
    ed.onclick=()=>{ const isAdmin=me&&me.role==='admin'; if(isAdmin){ const sel=$('#asg-user'); sel.value=a.username; if(sel.value!==a.username){ const o=document.createElement('option'); o.value=a.username; o.textContent=a.username; sel.appendChild(o); sel.value=a.username; } } else { $('#asg-user-nick').value=a.username; } renderAsgPerms(a.perms||[]); $('#asg-err').textContent=''; };
    const rm=document.createElement('button'); rm.className='mc-btn sm danger'; rm.textContent='Забрать';
    rm.onclick=async()=>{ if(await confirmModal('Забрать доступ у «'+a.username+'»?','Забрать доступ')){ const r=await api('POST','/api/servers/'+s.globalId+'/assign',{username:a.username,remove:true}); if(r.d&&r.d.error)toast(r.d.error); else { toast('Доступ забран.',true); refreshAssign(s.globalId); } } };
    row.appendChild(ed); row.appendChild(rm); acc.appendChild(row);
  }
  // выбор получателя: админ — из списка одобренных аккаунтов; владелец — по нику (без списка юзеров)
  const sel=$('#asg-user'); const nick=$('#asg-user-nick');
  const isAdmin = me && me.role==='admin';
  sel.style.display = isAdmin ? '' : 'none';
  nick.style.display = isAdmin ? 'none' : '';
  $('#asg-user-label').textContent = isAdmin ? 'Пользователь (одобренный аккаунт)' : 'Ник пользователя (точное совпадение)';
  nick.value='';
  if(isAdmin){
    sel.innerHTML='';
    let users=[]; try{ const r=await api('GET','/api/accounts'); users=(r.d&&r.d.users)||[]; }catch(e){}
    users=users.filter(u=> !s.owner || u.toLowerCase()!==String(s.owner).toLowerCase());
    sel.innerHTML = users.length ? ('<option value="">— выберите —</option>'+users.map(u=>'<option value="'+esc(u)+'">'+esc(u)+'</option>').join('')) : '<option value="">Нет одобренных пользователей</option>';
    sel.onchange=()=>renderAsgPerms(permsOfUser(s, sel.value)||[]);
  }
  renderAsgPerms([]);
  show('#asg-modal', true);
}
$('#asg-preset-full') && ($('#asg-preset-full').onclick=()=>{ $$('#asg-perms input').forEach(c=>c.checked=true); });
$('#asg-preset-view') && ($('#asg-preset-view').onclick=()=>{ $$('#asg-perms input').forEach(c=>{ c.checked=(c.value==='console.view'||c.value==='logs.view'||c.value==='files.read'); }); });
$('#asg-preset-none') && ($('#asg-preset-none').onclick=()=>{ $$('#asg-perms input').forEach(c=>c.checked=false); });
$('#asg-cancel') && ($('#asg-cancel').onclick=()=>show('#asg-modal',false));
// закрытие модалки по клику вне карточки и по Esc
$('#asg-modal') && ($('#asg-modal').onclick=(e)=>{ if(e.target.id==='asg-modal') show('#asg-modal',false); });
document.addEventListener('keydown',(e)=>{ if(e.key==='Escape'){ show('#asg-modal',false); show('#cf-modal',false); } });
$('#asg-save') && ($('#asg-save').onclick=async()=>{
  const isAdmin=me&&me.role==='admin';
  const u=(isAdmin?$('#asg-user').value:$('#asg-user-nick').value.trim());
  if(!u){ $('#asg-err').textContent= isAdmin?'Выберите пользователя':'Введите ник пользователя'; return; }
  const perms=$$('#asg-perms input').filter(c=>c.checked).map(c=>c.value);
  const r=await api('POST','/api/servers/'+assignTarget.globalId+'/assign',{username:u,perms:perms});
  if(r.d&&r.d.error){ $('#asg-err').textContent=r.d.error; } else { toast('Доступ обновлён для «'+u+'».', true); refreshAssign(assignTarget.globalId); }
});
function esc(x){ return String(x==null?'':x).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])); }

$('#tab-login').onclick=()=>{ $('#tab-login').classList.add('active'); $('#tab-reg').classList.remove('active'); show('#form-login',true); show('#form-reg',false); };
$('#tab-reg').onclick=()=>{ $('#tab-reg').classList.add('active'); $('#tab-login').classList.remove('active'); show('#form-login',false); show('#form-reg',true); };
$('#form-login').onsubmit=async(e)=>{ e.preventDefault(); const r=await api('POST','/api/login',{username:$('#li-user').value,password:$('#li-pass').value});
  if(r.ok) load(); else $('#li-err').textContent=(r.d&&r.d.error)||'Ошибка'; };
$('#form-reg').onsubmit=async(e)=>{ e.preventDefault(); const r=await api('POST','/api/register',{username:$('#rg-user').value,password:$('#rg-pass').value});
  if(r.ok){ $('#rg-err').className='err ok'; $('#rg-err').textContent='Заявка отправлена — ждите одобрения админа.'; } else { $('#rg-err').className='err'; $('#rg-err').textContent=(r.d&&r.d.error)||'Ошибка'; } };
$('#link-btn').onclick=async()=>{ const r=await api('POST','/api/link',{code:$('#link-code').value});
  if(r.d&&r.d.error){ $('#link-err').className='err'; $('#link-err').textContent=r.d.error; } else { $('#link-err').className='err ok'; $('#link-err').textContent='Сервер привязан!'; $('#link-code').value=''; loadServers(); } };
load();
</script>
</body>
</html>
